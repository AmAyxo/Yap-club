<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yap Club</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="name-screen" id="nameScreen">
            <div class="logo">YC</div>
            <p class="eyebrow">PRIVATE CHAT</p>
            <h1>Yap Club</h1>
            <p class="tagline">Come in. Yap. Leave no evidence.</p>

            <div class="name-form">
                <input
                    type="text"
                    id="nameInput"
                    placeholder="What's your name?"
                    maxlength="20"
                    autocomplete="off"
                >
                <button id="enterBtn">Enter club <span>→</span></button>
            </div>
        </section>

        <section class="chat-screen hidden" id="chatScreen">

            <header class="chat-header">
                <div>
                    <div class="brand">
                        <span class="status-dot"></span>
                        <h2>Yap Club</h2>
                    </div>
                    <p id="welcomeText">The club is open.</p>
                </div>
                <div class="club-mark">YC</div>
            </header>

            <div id="messages" class="messages">
                <div class="empty-state" id="emptyState">
                    <span>🗿</span>
                    <p>No yapping yet.</p>
                    <small>Be the first one to say something.</small>
                </div>
            </div>

            <form class="input-area" id="messageForm">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Say something..."
                    maxlength="500"
                    autocomplete="off"
                >
                <button type="submit" id="sendBtn" aria-label="Send message">↑</button>
            </form>

            <p class="hint">Press Enter to send</p>

        </section>

    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>

</body>

</html>
